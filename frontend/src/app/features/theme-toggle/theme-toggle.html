<div class="toggle">
    <button
        class="toggle__button"
        type="button"
        role="switch"
        [attr.aria-checked]="isDark()"
        [attr.aria-label]="(isDark() ? 'theme.activateLight' : 'theme.activateDark') | translate"
        (click)="toggleTheme()"
    >
        <fa-icon
            class="toggle__icon"
            [icon]="isDark() ? faMoon : faSun"
            aria-hidden="true"
        />
    </button>
</div>
